services:
  devenv:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: devenv
    hostname: devenv
    tty: true
    stdin_open: true
    working_dir: /workspace
    command: /bin/zsh
    volumes:
      - ./workspace:/workspace
      - nvim-data:/home/developer/.local/share/nvim
      - nvim-state:/home/developer/.local/state/nvim
      - cargo-cache:/home/developer/.cargo/registry
    environment:
      - TERM=xterm-256color
      - COLORTERM=truecolor
      - SHELL=/bin/zsh

volumes:
  nvim-data:
  nvim-state:
  cargo-cache:
