services:
  devenv:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${DEVBOX_UID:-1000}
        USER_GID: ${DEVBOX_GID:-1000}
        EDITOR_CHOICE: ${EDITOR_CHOICE:-nvim}
        EDITOR_CHOICES: ${EDITOR_CHOICES:-nvim}
        INSTALL_RUST: ${INSTALL_RUST:-0}
        INSTALL_CPP: ${INSTALL_CPP:-0}
        INSTALL_PYTHON: ${INSTALL_PYTHON:-0}
        INSTALL_NODE: ${INSTALL_NODE:-0}
        INSTALL_GO: ${INSTALL_GO:-0}
        INSTALL_JAVA: ${INSTALL_JAVA:-0}
    container_name: ${DEVBOX_CONTAINER_NAME:-devenv}
    hostname: devbox
    ports:
      - "127.0.0.1:8080:8080"
    tty: true
    stdin_open: true
    working_dir: /workspace
    command: ["sleep", "infinity"]
    volumes:
      - ${DEVBOX_WORKSPACE:-./workspace}:/workspace
      - nvim-data:/home/developer/.local/share/nvim
      - nvim-state:/home/developer/.local/state/nvim
      - cargo-cache:/home/developer/.cargo/registry
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
      SHELL: /bin/zsh
      ENABLE_COPILOT: ${ENABLE_COPILOT:-0}
      ENABLE_CODECOMPANION: ${ENABLE_CODECOMPANION:-0}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      PASSWORD: ${CODE_SERVER_PASSWORD:-}

volumes:
  nvim-data:
    name: my-dev-environment-nvim-data
  nvim-state:
    name: my-dev-environment-nvim-state
  cargo-cache:
    name: my-dev-environment-cargo-cache
